
<!DOCTYPE html>

<!--
============================================================
ARCHIVO: componentes/header.html
PROYECTO: KIOSKO BENANCIO
============================================================

Este documento contiene la cabecera y el menú de navegación.

Se mostrará dentro del archivo index.html mediante un iframe.

ESTRUCTURA DEL PROYECTO:

KioskoBenancio/
│
├── index.html
│
└── componentes/
    └── header.html

IMPORTANTE:

Un iframe permite mostrar un documento HTML dentro de otro.

Sin embargo, ambos documentos son independientes.

Por tanto:

- index.html tiene su propio DOM.
- header.html tiene su propio DOM.
- Los enlaces del iframe se abren dentro de él por defecto.

Para conseguir que los enlaces naveguen por la página
principal utilizaremos target="_top".

============================================================
-->

<html lang="es">

<!--
============================================================
1. HEAD: INFORMACIÓN DEL DOCUMENTO
============================================================

HEAD contiene los metadatos del documento.

No debemos confundir:

HEAD:
    Contiene información técnica y metadatos.

HEADER:
    Representa la cabecera semántica del contenido.

El atributo lang="es" del elemento HTML indica que
el idioma principal del documento es español.

Esto ayuda a los lectores de pantalla a utilizar
las reglas de pronunciación adecuadas.
============================================================
-->

<head>

    <!--
    Establecemos UTF-8 como codificación.

    Permite representar correctamente tildes,
    eñes y otros caracteres.
    -->

    <meta charset="UTF-8">

    <!--
    TITLE identifica el documento.

    Si abrimos header.html directamente, este título
    aparecerá normalmente en la pestaña del navegador.

    Si se carga dentro de un iframe, no sustituirá
    al título del documento principal.
    -->

    <title>Cabecera - Kiosko Benancio</title>

</head>

<!--
============================================================
2. BODY: CONTENIDO VISIBLE
============================================================

BODY contiene el contenido del documento.

En este caso incluye:

- HEADER: cabecera semántica.
- H1: encabezado principal.
- P: descripción del negocio.
- NAV: región de navegación.
- UL: lista no ordenada.
- LI: elementos de la lista.
- A: enlaces de navegación.
============================================================
-->

<body>

    <!--
    ========================================================
    3. HEADER: CABECERA SEMÁNTICA
    ========================================================

    HEADER representa contenido introductorio.

    En nuestro caso contiene:

    1. El nombre del kiosko.
    2. Una breve descripción.
    3. El menú de navegación principal.

    HEADER es una etiqueta semántica.

    A diferencia de DIV, proporciona información
    sobre la función del contenido.

    IMPORTANTE:

    Este HEADER pertenece al documento header.html.

    Aunque aparezca visualmente dentro de index.html,
    no pasa a formar parte de su DOM.

    ========================================================
    -->

    <header>

        <!--
        ====================================================
        4. H1: ENCABEZADO PRINCIPAL
        ====================================================

        H1 representa un encabezado de nivel 1.

        En este caso identifica el nombre del negocio.

        Los encabezados HTML permiten organizar
        jerárquicamente el contenido.

        Los lectores de pantalla pueden utilizarlos
        como puntos de navegación.

        No debemos elegir H1 únicamente porque
        queramos mostrar un texto grande.
        ====================================================
        -->

        <h1>Kiosko Benancio</h1>

        <!--
        ====================================================
        5. P: PÁRRAFO
        ====================================================

        P representa un párrafo de texto.

        Aquí contiene una descripción introductoria
        del negocio.

        Su función es estructural y semántica,
        no simplemente añadir separación visual.
        ====================================================
        -->

        <p>Tu kiosco de confianza</p>

        <!--
        ====================================================
        6. NAV: REGIÓN DE NAVEGACIÓN
        ====================================================

        NAV representa una región que contiene enlaces
        importantes de navegación.

        En nuestro ejemplo permite acceder a:

        - Quiénes somos.
        - Productos.
        - Horarios.
        - Contacto.

        ATRIBUTO ARIA-LABEL:

        aria-label="Navegación principal"

        Proporciona un nombre accesible a la región.

        Un lector de pantalla puede identificarla como
        "Navegación principal".

        Esto resulta útil cuando existen varias regiones
        de navegación dentro de una página.

        Por ejemplo:

        - Navegación principal.
        - Navegación secundaria.
        - Navegación del pie de página.

        NAV ya proporciona semántica de navegación.

        Por tanto, no necesitamos añadir
        role="navigation".

        ====================================================
        -->

        <nav aria-label="Navegación principal">

            <!--
            =================================================
            7. UL: LISTA NO ORDENADA
            =================================================

            UL significa Unordered List.

            Representa una lista cuyos elementos
            no necesitan estar numerados.

            Utilizamos una lista porque el menú
            está formado por varias opciones relacionadas.

            Los lectores de pantalla pueden comunicar
            la existencia de la lista y sus elementos.

            Dentro de UL colocaremos elementos LI.
            =================================================
            -->

            <ul>

                <!--
                ================================================
                8. PRIMER ENLACE: QUIÉNES SOMOS
                ================================================

                LI representa un elemento de lista.

                Dentro colocamos una etiqueta A.

                A representa un hipervínculo.

                ATRIBUTO HREF:

                href="../index.html#quienes-somos"

                Vamos a dividir esta ruta:

                ../
                    Sube un nivel desde la carpeta
                    componentes.

                index.html
                    Identifica el archivo principal.

                #quienes-somos
                    Identifica un fragmento del documento.

                El navegador buscará en index.html
                un elemento que tenga:

                id="quienes-somos"

                Por ejemplo:

                <section id="quienes-somos">

                ================================================
                9. ATRIBUTO TARGET="_TOP"
                ================================================

                Este atributo es especialmente importante
                porque header.html se carga en un iframe.

                Por defecto, los enlaces se abren
                en el mismo contexto de navegación.

                Si no utilizásemos target="_top",
                el navegador podría cargar index.html
                dentro del propio iframe.

                Esto provocaría que toda la página
                apareciese dentro del pequeño marco
                reservado para la cabecera.

                Con:

                target="_top"

                Indicamos que el destino debe abrirse
                en el contexto de navegación superior.

                En nuestro proyecto ese contexto
                corresponde a la página principal.

                IMPORTANTE:

                target debe ser un atributo independiente.

                CORRECTO:

                href="../index.html#quienes-somos"
                target="_top"

                INCORRECTO:

                href="../index.html#quienes-somos target='_top'"

                El atributo TARGET no es un atributo ARIA.

                Controla dónde se realiza la navegación.

                En iframes con restricciones sandbox,
                la navegación superior puede estar bloqueada.
                ================================================
                -->

                <li>

                    <a href="../index.html#quienes-somos"
                       target="_top">
                        Quiénes somos
                    </a>

                </li>

                <!--
                ================================================
                10. SEGUNDO ENLACE: PRODUCTOS
                ================================================

                Este enlace permite acceder a la sección
                de productos del documento principal.

                HREF:

                ../index.html#productos

                ../
                    Sube desde componentes a la raíz.

                index.html
                    Identifica la página principal.

                #productos
                    Busca el elemento con id="productos".

                En index.html tenemos:

                <section id="productos">

                TARGET:

                target="_top"

                Permite que la navegación se realice
                en la página superior y no en el iframe.

                IMPORTANTE:

                El valor de href termina después
                de #productos y su comilla de cierre.

                TARGET se escribe fuera de href,
                como otro atributo del enlace.
                ================================================
                -->

                <li>

                    <a href="../index.html#productos"
                       target="_top">
                        Productos
                    </a>

                </li>

                <!--
                ================================================
                11. TERCER ENLACE: HORARIOS
                ================================================

                Este enlace apunta a la sección de horarios.

                HREF:

                ../index.html#horarios

                El fragmento #horarios corresponde
                al identificador:

                id="horarios"

                En el documento principal tenemos:

                <section id="horarios"
                         aria-labelledby="titulo-horarios">

                El navegador localizará esta sección
                utilizando su atributo ID.

                No debemos confundir:

                id="horarios"
                    Identifica el elemento y permite
                    acceder mediante un enlace.

                aria-labelledby="titulo-horarios"
                    Relaciona la sección con el elemento
                    que proporciona su nombre accesible.

                TARGET="_TOP":

                Solicita que la navegación se realice
                en el contexto superior.

                No abre una pestaña nueva.
                ================================================
                -->

                <li>

                    <a href="../index.html#horarios"
                       target="_top">
                        Horarios
                    </a>

                </li>

                <!--
                ================================================
                12. CUARTO ENLACE: CONTACTO
                ================================================

                Este enlace permite acceder a la sección
                de contacto del documento principal.

                HREF:

                ../index.html#contacto

                El navegador buscará:

                id="contacto"

                En index.html tenemos:

                <section id="contacto"
                         aria-labelledby="titulo-contacto">

                TARGET="_TOP":

                Indica que el enlace debe navegar
                en la página superior.

                IMPORTANTE:

                Pulsar este enlace no envía el formulario.

                Únicamente navega hasta la sección
                en la que se encuentra.

                El envío del formulario se realiza
                mediante su botón de tipo submit.
                ================================================
                -->

                <li>

                    <a href="../index.html#contacto"
                       target="_top">
                        Contacto
                    </a>

                </li>

            </ul>

        </nav>

    </header>

</body>

</html>
